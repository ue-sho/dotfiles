[tools]
"npm:difit" = "latest"
aqua = "latest"
deno = "latest"
go = "latest"
mysql = "latest"
node = "latest"
npm = "latest"
pnpm = "latest"
python = "3.12"
ruby = "3.3.8"
rust = "latest"
shellcheck = "latest"
task = "latest"
terraform = "1.8.5"
uv = "latest"
yarn = "latest"

[tasks.switch]
description = "nix-darwin の設定を適用する (arm-mac / intel-mac を自動判別)"
run = """
#!/usr/bin/env bash
set -euo pipefail
[ "$(uname)" = "Darwin" ] || { echo "Darwin 専用タスク" >&2; exit 1; }
case "$(uname -m)" in
  arm64) host=arm-mac ;;
  x86_64) host=intel-mac ;;
esac
cd ~/dotfiles && sudo nix run github:LnL7/nix-darwin -- switch --flake ".#$host"
"""

[tasks.difit]
description = "未コミットの全差分 (未追跡ファイル含む) をブラウザでレビューする"
run = "difit . --include-untracked"

[tasks.difit-serve]
description = "difit をブラウザ自動起動なしで立ち上げる (cmux-setup が右上ペインで使用。引数例: --port 4966)"
run = "difit . --include-untracked --no-open --keep-alive"

[tasks.aws-sso-login]
alias = "al"
description = "SSOでログインして、現在のセッションに認証情報を設定する"
run = "aws sso login"

[tasks.clean-branch]
description = "リモートで削除されたブランチに対応するローカルブランチを自動削除する"
run = """
git fetch --prune && \
git for-each-ref --format '%(refname:short) %(upstream:short)' refs/heads | \
while read branch upstream; do
  [ -n "$upstream" ] && \
  remote_branch="${upstream#origin/}" && \
  [ -z "$(git ls-remote --heads origin "$remote_branch" 2>/dev/null)" ] && \
  git branch -d "$branch" 2>/dev/null || true
done
"""

[tasks.shellcheck]
description = "すべてのシェルスクリプトをチェックする"
run = """
find . -type f -name "*.sh" ! -path "./.git/*" ! -path "./result/*" | \
while read -r file; do
  echo "Checking: $file"
  shellcheck "$file" || exit 1
done
"""

[tasks.shellcheck-file]
description = "指定したシェルスクリプトファイルをチェックする"
run = "shellcheck \"$@\""

[tasks.shellcheck-all]
description = "すべてのシェルスクリプトを再帰的にチェックする（シェバン行のあるファイルも含む）"
run = """
find . -type f ! -path "./.git/*" ! -path "./result/*" | \
while read -r file; do
  if head -n1 "$file" | grep -qE "^#!.*/(ba)?sh"; then
    echo "Checking: $file"
    shellcheck "$file" || exit 1
  fi
done
"""

[tasks.empty-commit]
description = "空コミットを作成"
run = "git commit --allow-empty -m 'first commit'"

[tasks.kill-port]
description = "指定したポートで実行中のプロセスを強制終了する（例: mise run kill-port 8080）"
run = """
PORT=${1:-8080}
lsof -ti:$PORT | xargs kill -9 2>/dev/null || true
sleep 1
"""
